<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Welcome to FINMATE – Your PocketCA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Sora:wght@700;800&display=swap" rel="stylesheet">

<style>
/* ===== Theme: white + golden yellow ===== */
:root {
  --lemon: #FFC72C; --lemon-deep: #F5B000; --lemon-pale: #FFF1C2;
  --ink: #1F1A08; --muted: #6F6840;
  --font-head: "Sora", "Segoe UI", sans-serif; --font-body: "DM Sans", "Segoe UI", sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-body); color: var(--ink); background: #fff; min-height: 100vh; overflow-x: hidden; position: relative; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.glow { position: fixed; width: 460px; height: 460px; border-radius: 50%; background: var(--lemon); filter: blur(80px); opacity: .45; top: -150px; right: -120px; pointer-events: none; }

.page { position: relative; min-height: 100vh; display: flex; flex-direction: column; }
header { padding: 1.3rem 5vw; }
.logo { display: inline-flex; align-items: center; gap: .6rem; font: 800 1.4rem var(--font-head); color: var(--ink); text-decoration: none; }
.logo-mark { width: 38px; height: 38px; border-radius: 12px; background: var(--lemon); border: 2px solid var(--ink); display: grid; place-items: center; }
main { flex: 1; display: grid; grid-template-columns: 1.1fr .9fr; align-items: center; gap: 2rem; padding: 1rem 5vw 3rem; max-width: 1200px; width: 100%; margin: 0 auto; }

/* ===== Text ===== */
.small-line { font-size: 1.35rem; font-weight: 500; color: var(--muted); }
h1 { font: 800 clamp(3rem, 10vw, 6.2rem)/1 var(--font-head); letter-spacing: -.03em; }
h1 span { background: linear-gradient(transparent 62%, var(--lemon) 62%); }
.tagline { font-size: clamp(1.3rem, 3vw, 1.8rem); font-weight: 700; margin-top: 1rem; }
.tagline b { display: inline-block; background: var(--lemon); border: 2px solid var(--ink); padding: .02em .45em; border-radius: 10px; }
.lead { color: var(--muted); margin-top: .8rem; max-width: 44ch; }

/* ===== Animations: letters drop in, tag pops, buttons slide in, rupee symbols float ===== */
.fade { animation: fade .7s ease backwards; animation-delay: var(--d, 0s); }
@keyframes fade { from { opacity: 0; transform: translateY(16px); } }
.slide { animation: slide .6s cubic-bezier(.2,.8,.2,1) backwards; animation-delay: var(--d, 0s); }
@keyframes slide { from { opacity: 0; transform: translateX(-40px); } }
.word i { display: inline-block; font-style: normal; animation: drop .6s cubic-bezier(.3,1.6,.5,1) backwards; animation-delay: calc(var(--i) * 70ms + .15s); }
@keyframes drop { from { opacity: 0; transform: translateY(-.8em) rotate(-8deg); } }
.tagline b { animation: pop .5s 1s cubic-bezier(.3,1.6,.5,1) backwards; }
@keyframes pop { from { transform: scale(0); } }

/* ===== Buttons ===== */
.actions { display: grid; gap: .8rem; margin-top: 2rem; max-width: 460px; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: .8rem; }
.btn { font: 700 1rem var(--font-body); padding: .95rem 1.5rem; border-radius: 999px; border: 2px solid var(--ink); cursor: pointer; text-decoration: none; color: var(--ink);
  display: inline-flex; justify-content: center; align-items: center; gap: .6rem; background: #fff; transition: transform .2s, background .2s; }
.btn:hover { transform: translateY(-3px); background: var(--lemon-pale); }
.btn-main { background: var(--lemon); }
.btn-main:hover { background: var(--lemon-deep); }
.g-icon { width: 22px; height: 22px; border-radius: 50%; background: var(--ink); color: var(--lemon); display: grid; place-items: center; font: 800 .8rem var(--font-head); }

/* ===== Floating rupee symbols (plain ₹, no circle) ===== */
.scene { position: relative; height: 420px; }
.rs { position: absolute; font: 800 var(--sz) / 1 var(--font-head); color: var(--lemon); -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill;
  animation: bob var(--t, 4s) ease-in-out infinite; animation-delay: var(--dl, 0s); user-select: none; }
.r1 { --sz: 12rem; --t: 5s; top: 24%; left: 36%; }
.r2 { --sz: 5rem; --t: 4s; --dl: -1s; top: 6%; left: 10%; }
.r3 { --sz: 4rem; --t: 3.6s; --dl: -2s; top: 10%; right: 8%; color: #fff; }
.r4 { --sz: 4.6rem; --t: 4.4s; --dl: -.5s; bottom: 6%; left: 14%; }
.r5 { --sz: 3rem; --t: 3.8s; --dl: -2.6s; bottom: 18%; right: 12%; color: #fff; }
.r6 { --sz: 2.4rem; --t: 3.4s; --dl: -1.6s; top: 50%; left: 4%; }
@keyframes bob { 0%, 100% { transform: translateY(0) rotate(-5deg); } 50% { transform: translateY(-20px) rotate(5deg); } }

@media (max-width: 860px) {
  main { grid-template-columns: 1fr; text-align: center; }
  .actions { margin-left: auto; margin-right: auto; width: 100%; }
  .lead { margin-left: auto; margin-right: auto; }
  .scene { order: -1; height: 280px; }
  .rs { font-size: calc(var(--sz) * .6); }
}
@media (max-width: 420px) { .row { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; transition: none !important; } }
</style>
</head>

<body>
<div class="glow"></div>

<div class="page">
  <header>
    <a href="index.html" class="logo" aria-label="FINMATE home"><span class="logo-mark">F</span>FINMATE</a>
  </header>

  <main>
    <section>
      <p class="small-line fade">Welcome to</p>
      <h1><span class="word" aria-label="FINMATE"><i aria-hidden="true" style="--i:0">F</i><i aria-hidden="true" style="--i:1">I</i><i aria-hidden="true" style="--i:2">N</i><i aria-hidden="true" style="--i:3">M</i><i aria-hidden="true" style="--i:4">A</i><i aria-hidden="true" style="--i:5">T</i><i aria-hidden="true" style="--i:6">E</i></span></h1>
      <p class="tagline fade" style="--d:.7s">Your <b>PocketCA</b></p>
      <p class="lead fade" style="--d:.9s">Budgets, goals and smart money advice, always in your pocket.</p>

      <div class="actions">
                <div class="row slide" style="--d:1.1s">
          <a class="btn btn-main" href="signup.html">Sign Up</a>
          <a class="btn" href="login.html">Sign In</a>
        </div>
        <a class="btn slide" style="--d:1.25s" href="signup.html?via=google"><span class="g-icon" aria-hidden="true">G</span>Continue with Google</a>
      </div>
    </section>

    <section class="scene" aria-hidden="true">
      <span class="rs r1">₹</span><span class="rs r2">₹</span><span class="rs r3">₹</span>
      <span class="rs r4">₹</span><span class="rs r5">₹</span><span class="rs r6">₹</span>
    </section>
  </main>
</div>

</body>
</html>
