<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forgot password | FinMate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Sora:wght@700;800&display=swap" rel="stylesheet">
<style>
:root { --yellow:#FFD43B; --yellow-deep:#F5B800; --yellow-pale:#FFF6CC; --white:#FFFFFF; --ink:#1F1A08; --muted:#6F6840; --error:#1F1A08;
  --font-head:"Sora","Segoe UI",sans-serif; --font-body:"DM Sans","Segoe UI",sans-serif; }
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:var(--font-body); color:var(--ink); background:var(--white); min-height:100vh; display:grid; place-items:center; padding:1.5rem; position:relative; overflow-x:hidden; }
:focus-visible { outline:3px solid var(--ink); outline-offset:3px; }
.glow { position:fixed; border-radius:50%; filter:blur(70px); opacity:.55; pointer-events:none; }
.g1 { width:380px; height:380px; background:var(--yellow); top:-120px; right:-100px; animation:d1 14s ease-in-out infinite alternate; }
.g2 { width:320px; height:320px; background:var(--yellow-pale); bottom:-100px; left:-80px; animation:d2 16s ease-in-out infinite alternate; }
@keyframes d1 { to { transform:translate(-70px,80px) scale(1.15); } }
@keyframes d2 { to { transform:translate(90px,-60px) scale(1.2); } }
.card { position:relative; z-index:1; width:min(440px,100%); background:var(--white); border:2px solid var(--ink); border-radius:28px; padding:2rem; box-shadow:8px 8px 0 var(--yellow); animation:in .7s cubic-bezier(.2,.8,.2,1) backwards; }
@keyframes in { from { opacity:0; transform:translateY(30px) scale(.97); } }
.logo { display:inline-flex; align-items:center; gap:.5rem; font:800 1.15rem var(--font-head); color:var(--ink); text-decoration:none; margin-bottom:1.2rem; }
.logo-mark { width:30px; height:30px; border-radius:9px; background:var(--yellow); display:grid; place-items:center; }
h1 { font:800 1.9rem/1.15 var(--font-head); letter-spacing:-.02em; }
.sub { color:var(--muted); margin:.3rem 0 1.4rem; }
.field { margin-bottom:1rem; }
.field label { display:block; font-weight:700; font-size:.9rem; margin-bottom:.3rem; }
.input-wrap { position:relative; }
.field input { width:100%; padding:.8rem 1rem; border:2px solid var(--ink); border-radius:14px; font:inherit; background:var(--white); transition:background .2s, box-shadow .2s; }
.field input:focus { outline:none; background:var(--yellow-pale); box-shadow:0 0 0 4px var(--yellow); }
.field input.bad { background:var(--yellow-pale); border-style:dashed; animation:shake .35s; }
@keyframes shake { 25% { transform:translateX(-5px); } 75% { transform:translateX(5px); } }
.toggle { position:absolute; right:.6rem; top:50%; transform:translateY(-50%); border:none; background:none; font:700 .8rem var(--font-body); cursor:pointer; padding:.3rem .5rem; border-radius:8px; }
.toggle:hover { background:var(--yellow); }
.msg { min-height:1.3rem; font-size:.88rem; font-weight:700; margin-bottom:.4rem; }
.btn { width:100%; font:700 1rem var(--font-body); padding:.9rem 1rem; border-radius:999px; border:2px solid var(--ink); cursor:pointer; color:var(--ink); display:flex; justify-content:center; align-items:center; gap:.6rem; transition:transform .2s, box-shadow .2s, background .2s; }
.btn:hover { transform:translateY(-3px); box-shadow:0 5px 0 var(--ink); }
.btn:active { transform:none; box-shadow:none; }
.btn-yellow { background:var(--yellow); } .btn-yellow:hover { background:var(--yellow-deep); }
.btn-white { background:var(--white); } .btn-white:hover { background:var(--yellow-pale); }
.g-icon { width:22px; height:22px; border-radius:50%; background:var(--ink); color:var(--yellow); display:grid; place-items:center; font:800 .8rem var(--font-head); }
.or { display:flex; align-items:center; gap:.8rem; color:var(--muted); font-size:.85rem; margin:1rem 0; }
.or::before, .or::after { content:""; flex:1; height:2px; background:var(--yellow); border-radius:2px; }
.switch { text-align:center; margin-top:1.2rem; font-size:.95rem; }
.switch a { font-weight:700; color:var(--ink); background:linear-gradient(transparent 60%, var(--yellow) 60%); text-decoration:none; }
.note { font-size:.78rem; color:var(--muted); text-align:center; margin-top:1rem; }
@media (prefers-reduced-motion:reduce) { *, *::before { animation:none !important; transition:none !important; } }

.forgot { text-align:right; margin:-.4rem 0 .8rem; font-size:.9rem; }
.forgot a { font-weight:700; color:var(--ink); }
.done { background:var(--yellow-pale); border:2px solid var(--ink); border-radius:16px; padding:1rem 1.1rem; margin:.4rem 0 1rem; line-height:1.5; }
.rules { font-size:.8rem; color:var(--muted); margin:-.5rem 0 1rem; }
[hidden] { display:none !important; }
</style>
</head>
<body>
<div class="glow g1"></div><div class="glow g2"></div>
<main class="card">
  <a href="index.html" class="logo"><span class="logo-mark">F</span>FinMate</a>
  <h1>Forgot your password?</h1>
  <p class="sub">Enter your email and we will send you a link to choose a new one.</p>
  <form id="form" novalidate>
    <div class="field"><label for="email">Email</label><input type="email" id="email" autocomplete="email"></div>
    <p class="msg" id="msg" role="alert"></p>
    <button type="submit" class="btn btn-yellow">Send reset link</button>
  </form>
  <div id="done" class="done" hidden></div>
  <p class="switch"><a href="login.html">← Back to Sign In</a></p>
</main>
<script>
const msg = document.getElementById("msg");
const $ = (id) => document.getElementById(id);
function showError(input, text) {
  msg.textContent = text;
  if (input) { input.classList.add("bad"); input.focus(); setTimeout(() => input.classList.remove("bad"), 400); }
}
async function post(path, body) {
  const res = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  return { ok: res.ok, status: res.status, data: await res.json().catch(() => ({})) };
}

$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = $("email");
  if (!/^\S+@\S+\.\S+$/.test(email.value.trim())) return showError(email, "Enter a valid email, like name@example.com.");
  msg.textContent = "";
  try {
    const r = await post("/api/auth/forgot-password", { email: email.value.trim() });
    if (!r.ok) return showError(null, r.data.error || "Something went wrong. Please try again.");
    $("form").hidden = true;
    $("done").hidden = false;
    $("done").textContent = r.data.message + " Check your spam folder if you do not see it.";
  } catch (err) { showError(null, "Cannot reach the server. Is the Flask app running?"); }
});
</script>
</body>
</html>
